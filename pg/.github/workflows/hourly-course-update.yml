name: Hourly Course Update (Postgres)

on:
  schedule:
    # Hourly from 7 AM CST (13:00 UTC) to 10 PM CST (04:00 UTC next day)
    - cron: '0 13-23 * * *'
    - cron: '0 0-4 * * *'
  workflow_dispatch:

jobs:
  update-courses:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pg/package-lock.json

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates fonts-liberation libasound2 libatk-bridge2.0-0 \
            libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 \
            libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 \
            libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 \
            libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 \
            libxtst6 lsb-release wget xdg-utils

      - name: Install dependencies
        working-directory: pg
        run: npm ci

      - name: Extract courses
        working-directory: pg
        env:
          SELECTED_TERM: ${{ secrets.SELECTED_TERM }}
        run: npm run extract:courses

      - name: Load courses into Postgres
        working-directory: pg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/run-dumps.ts courses.sql

      - name: Run notification service
        working-directory: pg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ELASTIC_EMAIL_API_KEY: ${{ secrets.ELASTIC_EMAIL_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: npm run notify

      - name: Flush Redis cache
        working-directory: pg
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm run flush-cache
