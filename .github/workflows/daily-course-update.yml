name: Daily Course Update

on:
  schedule:
    # Run hourly from 7 AM CST (13:00 UTC) to 10 PM CST (04:00 UTC next day)
    - cron: '0 13-23 * * *'   # 7 AM–5 PM CST
    - cron: '0 0-4 * * *'     # 6 PM–10 PM CST
  workflow_dispatch:

jobs:
  update-courses:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
        
    - name: Run course search and enroll extractor
      run: node src/extractors/course_search_and_enroll_extractor.js
      
    - name: Run database dumps
      env:
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_PORT: ${{ secrets.DB_PORT }}
        REDIS_PUBLIC_URL: ${{ secrets.REDIS_PUBLIC_URL }}
      run: node src/utils/run_dumps.js data/sql/uw_madison_courses.sql
