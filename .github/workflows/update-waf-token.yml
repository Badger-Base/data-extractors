name: Update AWS WAF Token

on:
  schedule:
    # Run every 3 days at 2 AM UTC (token expires after ~4 days)
    - cron: '0 2 */3 * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-waf-token.yml'
      - 'src/utils/get_waf_token.js'
      - 'src/utils/update_github_secret.js'

jobs:
  update-token:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libasound2 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            lsb-release \
            wget \
            xdg-utils
      
      - name: Generate and Update WAF Token
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node src/utils/update_github_secret.js
        continue-on-error: true
      
      - name: Fallback - Generate Token Only
        if: failure()
        run: |
          echo "⚠️ Secret update failed, generating token for manual update..."
          TOKEN=$(node src/utils/get_waf_token.js)
          echo "::warning::Token generated but secret update failed. Please manually update AWS_WAF_TOKEN secret."
          echo "Generated token (first 50 chars): ${TOKEN:0:50}..."
          echo "Full token saved to token.txt (check artifacts)"
          echo "$TOKEN" > token.txt
      
      - name: Upload token artifact (if update failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: waf-token
          path: token.txt
          retention-days: 1

