name: Tests

on:
  push:
    branches: [new-main]
  pull_request:
    branches: [new-main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - run: npm test
