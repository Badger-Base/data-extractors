name: Tests

on:
  push:
    branches: [main, new-main, chore/drop-mysql-etl]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pg

    # The notifier's value is in its SQL — multi-table joins, bool_or over
    # section status, an enum column, cascade behaviour. Testing it against a
    # substitute engine would mean trusting a translation layer for exactly
    # the behaviour worth checking, so CI runs a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: extractors_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/extractors_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/extractors_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pg/package-lock.json

      - run: npm ci

      - run: npm test
