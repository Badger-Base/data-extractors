name: Semester Data Refresh (Postgres)

on:
  schedule:
    # Twice per semester: late Aug (fall start) and late Jan (spring start)
    - cron: '0 6 25 1 *'   # Jan 25 at midnight CST
    - cron: '0 6 25 8 *'   # Aug 25 at midnight CST
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pg/package-lock.json

      - name: Install dependencies
        working-directory: pg
        run: npm ci

      - name: Extract madgrades
        working-directory: pg
        env:
          MADGRADES_API_TOKEN: ${{ secrets.MADGRADES_API_TOKEN }}
        run: npm run extract:madgrades

      - name: Extract RMP
        working-directory: pg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run extract:rmp

      - name: Load madgrades and RMP
        working-directory: pg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/run-dumps.ts madgrades.sql rmp.sql

      - name: Flush Redis cache
        working-directory: pg
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm run flush-cache
