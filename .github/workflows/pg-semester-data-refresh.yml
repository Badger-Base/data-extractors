name: Semester Data Refresh (Postgres)

on:
  schedule:
    # Twice per semester: late Aug (fall start) and late Jan (spring start)
    - cron: '0 6 25 1 *'   # Jan 25 at midnight CST
    - cron: '0 6 25 8 *'   # Aug 25 at midnight CST
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pg/package-lock.json

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 \
            libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 \
            libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 \
            libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 \
            libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 \
            libxtst6 lsb-release wget xdg-utils

      - name: Install dependencies
        working-directory: pg
        run: npm ci

      - name: Extract madgrades
        working-directory: pg
        env:
          MADGRADES_API_TOKEN: ${{ secrets.MADGRADES_API_TOKEN }}
        run: npm run extract:madgrades

      - name: Extract RMP
        working-directory: pg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run extract:rmp

      - name: Load madgrades and RMP
        working-directory: pg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx src/run-dumps.ts madgrades.sql rmp.sql

      - name: Flush Redis cache
        working-directory: pg
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm run flush-cache
